<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(135deg,#2E2560 0%,#4A3AA0 55%,#6B4FBB 100%);
  font-family:'IBM Plex Sans',system-ui,sans-serif;color:#241F45
}
.box{
  width:100%;max-width:390px;background:#fff;border-radius:16px;padding:34px 30px 28px;
  box-shadow:0 20px 60px -20px rgba(20,14,50,.55)
}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:#726CA0;margin:0 0 9px
}
h1{margin:0 0 8px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:25px;letter-spacing:-.02em}
p.lead{margin:0 0 22px;font-size:13.5px;color:#726CA0;line-height:1.5}
label{display:block;font-size:13px;font-weight:500;margin-bottom:7px}
input{
  width:100%;padding:12px 14px;border:1.5px solid #CFC8EA;border-radius:9px;
  font-family:'IBM Plex Mono',monospace;font-size:15px;background:#FCFBFF
}
input:focus{outline:none;border-color:#4A3AC9;background:#fff;box-shadow:0 0 0 3px rgba(74,58,201,.15)}
button{
  width:100%;margin-top:14px;padding:13px;border:none;border-radius:9px;
  background:#241F45;color:#fff;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer
}
button:hover{background:#3C356B}
button:disabled{opacity:.6;cursor:default}
.msg{margin-top:13px;font-size:13px;min-height:19px}
.msg.err{color:#C2557A}
.msg.wait{color:#726CA0}
.foot{margin-top:22px;padding-top:16px;border-top:1px solid #E2DEF3;font-size:11.5px;color:#726CA0;line-height:1.55}
</style>
</head>

  var b64 = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };
  var el  = function(id){ return document.getElementById(id); };

  var SB_URL = "https://jykvdixkgzleknhhplvt.supabase.co";
  var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5a3ZkaXhrZ3psZWtuaGhwbHZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDQxMjksImV4cCI6MjEwMzkyMDEyOX0.QW6NFVv2oqarUPN_qnnqSc_qlFvFWeKnPO-vZUVAhAo";
  var PORTAL = "https://relitalkschool.github.io/relitalk-portal/";

  function setMsg(cls, txt){ var m = el('msg'); if(m){ m.className='msg '+cls; m.textContent = txt; } }

  async function decryptAndShow(pw){
    var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(DATA.s), iterations:DATA.n, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var out = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(DATA.i)}, key, b64(DATA.c));
    /* Разворачиваем приложение в этом же документе (буфер/печать блокируются в iframe). */
    document.open(); document.write(new TextDecoder().decode(out)); document.close();
  }

  async function main(){
    if(typeof supabase === 'undefined'){ setMsg('err','Нет соединения. Обновите страницу.'); return; }
    var sb = supabase.createClient(SB_URL, SB_KEY);
    var s = await sb.auth.getSession();
    var session = (s && s.data) ? s.data.session : null;
    if(!session){ setMsg('wait','Требуется вход. Перенаправляем в портал…'); setTimeout(function(){ location.href = PORTAL; }, 1200); return; }
    /* Ключ отдаётся только авторизованным ролям (RLS в Supabase). */
    var r = await sb.from('tool_secrets').select('value').eq('key','refund_password').maybeSingle();
