<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Relitalk — доступ для кураторов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(135deg,#2E2560 0%,#4A3AA0 55%,#6B4FBB 100%);
  font-family:'IBM Plex Sans',system-ui,sans-serif;color:#241F45
}
.box{
  width:100%;max-width:390px;background:#fff;border-radius:16px;padding:34px 30px 28px;
  box-shadow:0 20px 60px -20px rgba(20,14,50,.55)
}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:#726CA0;margin:0 0 9px
}
h1{margin:0 0 8px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:25px;letter-spacing:-.02em}
p.lead{margin:0 0 22px;font-size:13.5px;color:#726CA0;line-height:1.5}
label{display:block;font-size:13px;font-weight:500;margin-bottom:7px}
input{
  width:100%;padding:12px 14px;border:1.5px solid #CFC8EA;border-radius:9px;
  font-family:'IBM Plex Mono',monospace;font-size:15px;background:#FCFBFF
}
input:focus{outline:none;border-color:#4A3AC9;background:#fff;box-shadow:0 0 0 3px rgba(74,58,201,.15)}
button{
  width:100%;margin-top:14px;padding:13px;border:none;border-radius:9px;
  background:#241F45;color:#fff;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer
}
button:hover{background:#3C356B}
button:disabled{opacity:.6;cursor:default}
.msg{margin-top:13px;font-size:13px;min-height:19px}
.msg.err{color:#C2557A}
.msg.wait{color:#726CA0}
.foot{margin-top:22px;padding-top:16px;border-top:1px solid #E2DEF3;font-size:11.5px;color:#726CA0;line-height:1.55}
</style>
</head>
<body>
<div class="box">
  <p class="eyebrow">Relitalk Ltd.</p>
  <h1>Расчёт возврата</h1>
  <p class="lead">Внутренний инструмент службы поддержки. Введите пароль, выданный руководителем.</p>

  <label for="pw">Пароль</label>
  <input type="password" id="pw" autocomplete="current-password" autofocus>
  <button id="go">Открыть</button>
  <div class="msg" id="msg"></div>

  <p class="foot">Страница и документы предназначены для внутреннего использования. Не пересылайте ссылку и пароль клиентам.</p>
</div>

      var out = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(DATA.i)}, key, b64(DATA.c));
      var html = new TextDecoder().decode(out);
      /* Рендерим приложение в изолированном документе, чтобы области видимости не пересекались */
      var frame = document.createElement('iframe');
      frame.setAttribute('title','Расчёт возврата');
      frame.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;margin:0;background:#F1EFFA';
      document.body.innerHTML = '';
      document.body.style.cssText = 'margin:0;padding:0;background:#F1EFFA;display:block';
      document.documentElement.style.height = '100%';
      document.body.appendChild(frame);
      var fd = frame.contentDocument || frame.contentWindow.document;
      fd.open(); fd.write(html); fd.close();
    }catch(e){
      el('go').disabled = false;
      el('msg').className='msg err';
      el('msg').textContent='Неверный пароль.';
      el('pw').select();
    }
  }
  el('go').addEventListener('click', unlock);
  el('pw').addEventListener('keydown', function(e){ if(e.key === 'Enter') unlock(); });
})();
</script>
</body>
</html>
